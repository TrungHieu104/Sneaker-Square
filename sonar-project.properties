sonar.projectKey=sneaker-square
sonar.projectName=Sneaker Square
sonar.sourceEncoding=UTF-8

sonar.sources=app,routes,config,database
sonar.tests=tests

# Left out of the analysis, each for a reason:
# - vendor/, public/, storage/, bootstrap/cache/: third-party or generated.
# - resources/views/: SonarQube has no Blade analyser and reads it as plain PHP.
# - database/seeders/: demo data — rows of literals and random values for a
#   development database, never run in production.
# - the permission tables migration: published unchanged from spatie/laravel-permission.
sonar.exclusions=vendor/**,public/**,storage/**,bootstrap/cache/**,resources/views/**,node_modules/**,database/seeders/**,database/migrations/*_create_permission_tables.php

# config/*.php are Laravel's own defaults, where a repeated driver name is the
# documented shape of the file rather than a missing constant.
sonar.issue.ignore.multicriteria=cfg
sonar.issue.ignore.multicriteria.cfg.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.cfg.resourceKey=config/**
